<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#070a10;
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#e8edf6; }
    .card { text-align:center; max-width:340px; padding:32px 24px; }
    .badge { width:74px; height:74px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; font-size:34px; }
    .ok .badge { background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.45); }
    .no .badge { background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.45); }
    h1 { font-size:21px; margin:0 0 8px; }
    p { color:#9aa7bd; font-size:14px; line-height:1.6; margin:0; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge" id="badge">✓</div>
    <h1 id="title">Payment complete</h1>
    <p id="msg">You're all set — show this screen to your stylist. A receipt is on its way if we have your email.</p>
  </div>
  <script src="/js/paydone.js"></script>
</body>
</html>
