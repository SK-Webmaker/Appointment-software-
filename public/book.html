<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an appointment</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='2' y1='2' x2='46' y2='46' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%231d4ed8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12.5' fill='url(%23t)'/%3E%3Cpath d='M15.6 13V35' stroke='%23fff' stroke-width='4.6' stroke-linecap='round'/%3E%3Cpath d='M18.5 25.4A13 13 0 0 1 28.6 15.9' stroke='%23fff' stroke-width='4.6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M18.5 25.4L31.6 35' stroke='%23fff' stroke-width='4.6' stroke-linecap='round'/%3E%3Ccircle cx='33' cy='13.2' r='3.2' fill='%23bae6fd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .book-wrap {
      max-width: 660px; margin: 0 auto; padding: 40px 20px 80px;
      min-height: 100vh;
    }
    body {
      background:
        radial-gradient(700px 400px at 15% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent),
        radial-gradient(500px 350px at 90% 100%, color-mix(in srgb, var(--accent) 5%, transparent), transparent),
        var(--bg);
    }
    /* Business-chosen light look — set by book.js from Settings → Booking page */
    :root[data-brand-theme="light"] {
      --bg: #f5f7fa;
      --bg-raise: #ffffff;
      --panel: #ffffff;
      --panel-2: #eef2f7;
      --panel-3: #e5ebf4;
      --border: #d9e1ec;
      --border-soft: #e6ecf4;
      --text: #131c2b;
      --text-2: #4a5a70;
      --muted: #8895a9;
      --shadow: 0 12px 30px rgba(16, 24, 40, 0.1);
    }
    .brand-logo {
      max-height: 72px; max-width: 240px; border-radius: 12px;
      margin: 0 auto 14px; display: block; object-fit: contain;
    }
    .brand-tagline { color: var(--text-2); font-size: 13px; margin-top: 8px; font-style: italic; }
    /* Font presets — no external fonts (CSP-safe); headings pick up --brand-display */
    :root[data-brand-font="classic"] { --brand-display: Georgia, 'Times New Roman', serif; }
    :root[data-brand-font="rounded"] { --brand-display: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
    .book-head h1, .bk-section-title, .confirm-card h2 { font-family: var(--brand-display, inherit); }
    :root[data-brand-font="classic"] .book-head h1 { letter-spacing: -0.01em; font-weight: 700; }
    /* Cover hero banner */
    .brand-cover {
      width: 100%; height: 190px; object-fit: cover;
      border-radius: 16px; margin-bottom: 22px; display: block;
      border: 1px solid var(--border);
    }
    /* Photo gallery strip on the service step */
    .brand-gallery {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px;
      margin-bottom: 22px;
    }
    .brand-gallery img {
      width: 100%; height: 92px; object-fit: cover; border-radius: 12px;
      border: 1px solid var(--border);
    }
    @media (max-width: 520px) { .brand-gallery img { height: 70px; } }
    .book-head { text-align: center; margin-bottom: 30px; }
    .book-head h1 { font-size: 24px; letter-spacing: -0.02em; }
    .book-head .sub { color: var(--text-2); font-size: 13.5px; margin-top: 6px; }
    .steps { display: flex; gap: 6px; justify-content: center; margin: 22px 0 26px; }
    .steps .s {
      width: 34px; height: 4px; border-radius: 2px; background: var(--panel-3);
      transition: background 0.2s;
    }
    .steps .s.done { background: var(--accent-grad); }
    .bk-section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .bk-option {
      width: 100%; text-align: left;
      display: flex; align-items: center; gap: 12px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 9px;
      transition: border-color 0.12s, transform 0.06s;
    }
    .bk-option:hover { border-color: var(--accent); transform: translateY(-1px); }
    .bk-option .o-name { font-weight: 700; font-size: 14px; }
    .bk-option .o-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bk-option .o-price { margin-left: auto; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .bk-cat { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 18px 0 9px; font-weight: 600; }
    .bk-hint { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; }
    /* multi-select service rows: a check bubble that fills once picked */
    .svc-pick .svc-check {
      flex: none; width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid var(--border); display: grid; place-items: center;
      color: transparent; transition: all 0.12s;
    }
    .svc-pick.picked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .svc-pick.picked .svc-check { background: var(--accent-grad); border-color: transparent; color: var(--accent-ink, #051422); }
    .bk-cartbar {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px;
      width: min(560px, calc(100% - 32px)); z-index: 20;
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-raise); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px 12px 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.32);
    }
    .bk-cartbar .cart-info { flex: 1; font-size: 13px; }
    .bk-cartbar .cart-info b { font-size: 15px; }
    .bk-cartbar .cart-info span { color: var(--muted); }
    .date-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 18px; }
    .date-chip {
      flex: 0 0 auto; text-align: center; min-width: 64px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 10px;
    }
    .date-chip .d-day { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .date-chip .d-num { font-size: 17px; font-weight: 700; margin-top: 2px; }
    .date-chip.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .date-chip.sel .d-day { color: var(--accent); }
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .slot {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 4px; text-align: center;
      font-weight: 600; font-size: 13px;
    }
    .slot:hover { border-color: var(--accent); }
    .slot.sel { background: var(--accent-grad); color: var(--accent-ink, #051422); border-color: transparent; }
    .bk-back { color: var(--text-2); font-size: 13px; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .bk-summary {
      display: flex; gap: 12px; align-items: center;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; margin-bottom: 18px; font-size: 13px;
    }
    .confirm-card { text-align: center; padding: 40px 24px; }
    .confirm-icon {
      width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--green);
    }
    .powered { text-align: center; margin-top: 34px; color: var(--muted); font-size: 12px; }
    .powered b { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="book-wrap" id="book"></div>
  <script type="module" src="/js/book.js"></script>
</body>
</html>
