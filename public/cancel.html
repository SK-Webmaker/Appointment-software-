<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cancel your appointment</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='2' y1='2' x2='46' y2='46' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%231d4ed8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12.5' fill='url(%23t)'/%3E%3Cpath d='M15.6 13V35' stroke='%23fff' stroke-width='4.6' stroke-linecap='round'/%3E%3Cpath d='M18.5 25.4A13 13 0 0 1 28.6 15.9' stroke='%23fff' stroke-width='4.6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M18.5 25.4L31.6 35' stroke='%23fff' stroke-width='4.6' stroke-linecap='round'/%3E%3Ccircle cx='33' cy='13.2' r='3.2' fill='%23bae6fd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Deliberately the same shell as the review page — a client who has seen
       one should recognise the other as the same business. */
    .cx-wrap { max-width: 520px; margin: 0 auto; padding: 48px 20px 80px; min-height: 100vh; }
    body {
      background:
        radial-gradient(700px 400px at 15% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent),
        radial-gradient(500px 350px at 90% 100%, color-mix(in srgb, var(--accent) 5%, transparent), transparent),
        var(--bg);
    }
    :root[data-brand-theme="light"] {
      --bg: #f5f7fa; --bg-raise: #ffffff; --panel: #ffffff; --panel-2: #eef2f7; --panel-3: #e5ebf4;
      --border: #d9e1ec; --border-soft: #e6ecf4; --text: #131c2b; --text-2: #4a5a70; --muted: #8895a9;
      --shadow: 0 12px 30px rgba(16, 24, 40, 0.1);
    }
    :root[data-brand-font="classic"] { --brand-display: Georgia, 'Times New Roman', serif; }
    :root[data-brand-font="rounded"] { --brand-display: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
    .brand-logo { max-height: 64px; max-width: 220px; border-radius: 12px; margin: 0 auto 14px; display: block; object-fit: contain; }
    .cx-head { text-align: center; margin-bottom: 24px; }
    .cx-head h1 { font-size: 22px; letter-spacing: -0.02em; font-family: var(--brand-display, inherit); }
    .cx-head .sub { color: var(--text-2); font-size: 13.5px; margin-top: 6px; }
    .cx-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 28px 24px; text-align: center;
    }
    .cx-card h2 { font-size: 18px; margin-bottom: 6px; font-family: var(--brand-display, inherit); }
    .cx-card .lede { color: var(--text-2); font-size: 13.5px; line-height: 1.6; }

    /* The booking itself, laid out as plain rows so it reads like a receipt
       rather than a form. */
    .cx-details {
      text-align: left; margin: 22px 0 20px;
      border: 1px solid var(--border-soft); border-radius: 12px; overflow: hidden;
    }
    /* The label column is only as wide as its longest word, so the value —
       usually the date and time — keeps to one line on a phone. */
    .cx-row { display: flex; gap: 12px; padding: 11px 14px; font-size: 13.5px; }
    .cx-row + .cx-row { border-top: 1px solid var(--border-soft); }
    .cx-row dt { color: var(--muted); flex: 0 0 64px; }
    .cx-row dd { color: var(--text); font-weight: 600; flex: 1; min-width: 0; text-wrap: balance; }

    .cx-actions { display: flex; flex-direction: column; gap: 10px; }
    .cx-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 46px; padding: 12px 18px; border-radius: 11px;
      font: inherit; font-weight: 600; font-size: 14.5px; cursor: pointer; border: 1px solid transparent;
    }
    .cx-btn.danger { background: var(--red, #ef4444); color: #fff; }
    .cx-btn.danger:hover { filter: brightness(1.07); }
    .cx-btn.danger:disabled { opacity: 0.6; cursor: default; filter: none; }
    .cx-btn.quiet { background: var(--panel-2); border-color: var(--border); color: var(--text); text-decoration: none; }
    .cx-btn.quiet:hover { border-color: var(--muted); }
    .cx-btn.brand { background: var(--accent-grad); color: var(--accent-ink, #051422); text-decoration: none; }
    .cx-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .cx-note {
      font-size: 12.5px; color: var(--muted); line-height: 1.6;
      margin-top: 14px; text-align: center;
    }
    .cx-callout {
      text-align: left; font-size: 13px; line-height: 1.6; color: var(--text-2);
      background: var(--panel-2); border: 1px solid var(--border-soft);
      border-radius: 11px; padding: 12px 15px; margin: 18px 0 4px;
    }
    .cx-callout b { color: var(--text); }
    .cx-mark {
      width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%;
      display: grid; place-items: center;
    }
    .cx-mark.done { background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.4); color: var(--green); }
    .cx-mark.warn { background: rgba(245, 180, 0, 0.12); border: 1px solid rgba(245, 180, 0, 0.4); color: #f5b400; }
    .cx-phone { font-weight: 600; color: var(--text); white-space: nowrap; }
    .powered { text-align: center; margin-top: 30px; color: var(--muted); font-size: 12px; }
    .powered b { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="cx-wrap" id="cancel"></div>
  <script type="module" src="/js/cancel.js"></script>
</body>
</html>
