<!doctype html>
<html><head><meta charset="utf-8">
<link href="fonts/local.css" rel="stylesheet">
<style>
:root{--teal:#2dd4bf;--blue:#60a5fa;--violet:#a78bfa;--ink:#0b1020;--grad:linear-gradient(100deg,#2dd4bf 0%,#60a5fa 55%,#a78bfa 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,system-ui,sans-serif;color:#e8edf7;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 800px at 50% 40%,#131a33 0%,#0b1020 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.42}
.o1{width:760px;height:760px;background:#14b8a6}.o2{width:680px;height:680px;background:#6366f1}.o3{width:560px;height:560px;background:#0ea5e9}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(900px 600px at 50% 50%,#000 30%,transparent 80%)}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font:700 22px Inter;letter-spacing:.32em;text-transform:uppercase;color:#8fa3c7}
.h1{font:800 104px/1.04 Inter;letter-spacing:-.035em;text-align:center}
.h2{font:800 64px/1.1 Inter;letter-spacing:-.03em}
.mono{font-family:'JetBrains Mono',monospace}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font:600 24px Inter;color:#e2e8f0}
.pill svg{width:26px;height:26px}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.13);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.white{background:#fff;color:#0f172a;border-radius:24px;box-shadow:0 40px 120px rgba(0,0,0,.5)}
/* browser */
.browser{position:absolute;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 50px 140px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);color:#0f172a;transform-origin:0 0}
.browser .bar{height:58px;background:#f1f5f9;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #e2e8f0}
.browser .dot{width:13px;height:13px;border-radius:50%}
.browser .url{flex:1;margin-left:18px;height:36px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 16px;font:500 18px Inter;color:#334155}
.browser .url svg{width:16px;height:16px;flex:none}
.browser .page{position:absolute;top:58px;left:0;right:0;bottom:0;background:#fff}
.view{position:absolute;inset:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:12px;font:600 20px Inter;white-space:nowrap}
.btn.teal{background:#0d9488;color:#fff}.btn.dark{background:#0f172a;color:#fff}.btn.ghost{background:#f1f5f9;color:#0f172a}
.btn.green{background:#16a34a;color:#fff}.btn.orange{background:#ea580c;color:#fff}
.input{height:60px;border:2px solid #cbd5e1;border-radius:12px;display:flex;align-items:center;padding:0 18px;font:500 22px Inter;color:#0f172a;background:#fff}
.input.focus{border-color:#0d9488;box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.ph{color:#94a3b8}
.caret{display:inline-block;width:2px;height:26px;background:#0f172a;margin-left:2px;vertical-align:middle}
.barph{height:16px;border-radius:8px;background:#e2e8f0}
.muted{color:#64748b}
/* overlay chrome */
#stepper{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:flex;gap:10px;opacity:0}
.st{display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font:600 17px Inter;color:#8fa3c7;transition:none}
.st b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font:700 15px Inter;color:#cbd5e1}
.st.on{background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.45);color:#fff}
.st.on b{background:var(--grad);color:#06231f}
.st.done b{background:#14b8a6;color:#06231f}
#caption{position:absolute;bottom:56px;left:50%;display:flex;align-items:center;gap:18px;padding:20px 34px 20px 22px;border-radius:20px;background:rgba(9,13,28,.78);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.45);font:600 28px Inter;color:#f1f5f9;white-space:nowrap;opacity:0}
#caption .bar{width:6px;height:38px;border-radius:3px;background:var(--grad)}
#card{position:absolute;inset:0;background:radial-gradient(1100px 700px at 30% 40%,#16204a 0%,#0a0f22 70%);display:flex;flex-direction:column;justify-content:center;padding-left:220px;clip-path:inset(0 100% 0 0)}
#card .num{font:800 300px/0.9 Inter;letter-spacing:-.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#card .ttl{font:800 92px/1.05 Inter;letter-spacing:-.035em;margin-top:18px;color:#fff}
#card .eyebrow{margin-bottom:22px;color:#5eead4}
#card .line{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--grad)}
#cursor{position:absolute;left:0;top:0;width:44px;height:44px;opacity:0;pointer-events:none;z-index:50}
#cursor svg{position:absolute;left:0;top:0;width:44px;height:44px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.ripple{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:4px solid #2dd4bf;opacity:0}
.ring{position:absolute;border:4px solid #2dd4bf;border-radius:18px;box-shadow:0 0 0 8px rgba(45,212,191,.22),0 0 40px rgba(45,212,191,.45);opacity:0;pointer-events:none;z-index:40}
#fx{position:absolute;inset:0;z-index:45;pointer-events:none}
/* icons */
.ico{display:block}
.att{display:flex;align-items:center;gap:20px;padding:20px 22px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0;margin-top:14px}
.att .nm{font:600 22px 'JetBrains Mono',monospace;color:#0f172a}
.att .sz{font:500 17px Inter;color:#64748b;margin-top:4px}
.badge{margin-left:auto;padding:8px 16px;border-radius:999px;font:700 16px Inter;letter-spacing:.02em}
.info{width:620px;padding:34px 36px;display:flex;gap:26px;align-items:flex-start}
.info .t{font:700 30px Inter;color:#fff;margin-bottom:10px}
.info .d{font:500 22px/1.45 Inter;color:#b6c3dc}
.iconbox{flex:none;width:76px;height:76px;border-radius:20px;display:grid;place-items:center}
.iconbox svg{width:42px;height:42px}
.pane{position:absolute;top:220px;width:740px;height:560px}
.pane .hd{display:flex;align-items:center;gap:14px;padding:22px 28px;font:700 26px Inter;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.fileicon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:14px;width:240px}
.fileicon .lbl{font:600 19px 'JetBrains Mono',monospace;color:#e2e8f0;text-align:center}
.menu{position:absolute;width:280px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.45);padding:8px;color:#0f172a;font:500 20px Inter;opacity:0}
.menu div{padding:11px 16px;border-radius:8px}
.menu .on{background:#e0f2fe}
.dlg{position:absolute;width:520px;background:#fff;border-radius:16px;padding:28px;color:#0f172a;box-shadow:0 30px 70px rgba(0,0,0,.5);opacity:0}
.tip{display:inline-flex;align-items:center;gap:14px;padding:18px 30px;border-radius:999px;background:rgba(20,184,166,.15);border:1px solid rgba(45,212,191,.5);font:700 26px Inter;color:#ccfbf1}
.drop{position:absolute;left:170px;right:170px;top:150px;height:420px;border:4px dashed #cbd5e1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f8fafc}
.prog{width:520px;height:16px;border-radius:8px;background:#e2e8f0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#3b82f6)}
.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:16px;font:600 24px Inter;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e2e8f0}
.toggle{width:96px;height:52px;border-radius:26px;background:#475569;position:relative}
.toggle i{position:absolute;top:5px;left:5px;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.side{position:absolute;left:0;top:0;bottom:0;width:290px;background:#f8fafc;border-right:1px solid #e2e8f0;padding:28px 18px}
.side div{padding:14px 16px;border-radius:10px;font:600 19px Inter;color:#334155;margin-bottom:6px}
.side .on{background:#ccfbf1;color:#0f766e}
.ns{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:12px;background:#f1f5f9;margin-top:10px;font:600 21px 'JetBrains Mono',monospace;color:#0f172a}
.fly{position:absolute;padding:8px 14px;border-radius:10px;background:#0d9488;color:#fff;font:600 18px 'JetBrains Mono',monospace;z-index:44;opacity:0;white-space:nowrap}
.check li{list-style:none;display:flex;align-items:center;gap:22px;padding:18px 0;font:600 32px Inter;color:#e2e8f0;border-bottom:1px solid rgba(255,255,255,.08)}
.cb{width:46px;height:46px;border-radius:14px;border:3px solid rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.cb svg{width:28px;height:28px;opacity:0}
.own{width:400px;padding:40px 34px;text-align:center}
.own .iconbox{margin:0 auto 24px}
</style></head>
<body><div id="stage">
<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div id="grid"></div></div>
<div id="scenes"></div>

<div id="stepper"></div>
<div id="caption"><span class="bar"></span><span class="txt"></span></div>
<div id="card"><div class="line"></div><div class="eyebrow"></div><div class="num"></div><div class="ttl"></div></div>
<div id="cursor"><div class="ripple r1"></div><div class="ripple r2"></div><svg viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.9 1.5 4 7.3-2.9 1.6-4-7.4-5.1 4.9z" fill="#fff" stroke="#0b1020" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
</div>
<script>
// ---------- helpers ----------

  e.innerHTML=(n===0&&ph&&t<t0?`<span class="ph">${ph}</span>`:txt.slice(0,n))+((typing||(t>=t0&&t<t0+txt.length/cps+.8&&blink))?'<span class="caret"></span>':'');}
const stage=document.getElementById('stage');
function rect(e){const r=e.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height,cx:r.left+r.width/2,cy:r.top+r.height/2}}
// icons
const I={
 zip:(c='#60a5fa')=>`<svg class="ico" viewBox="0 0 64 80" width="120" height="150"><path d="M8 2h34l18 18v54a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z" fill="#e2e8f0"/><path d="M42 2v14a4 4 0 0 0 4 4h14" fill="#cbd5e1"/><rect x="22" y="6" width="8" height="5" fill="${c}"/><rect x="26" y="11" width="8" height="5" fill="${c}"/><rect x="22" y="16" width="8" height="5" fill="${c}"/><rect x="26" y="21" width="8" height="5" fill="${c}"/><rect x="22" y="26" width="8" height="5" fill="${c}"/><rect x="21" y="33" width="14" height="14" rx="3" fill="${c}"/><rect x="25" y="39" width="6" height="4" rx="1" fill="#e2e8f0"/><text x="32" y="68" font-family="Inter" font-weight="800" font-size="11" text-anchor="middle" fill="#475569">ZIP</text></svg>`,
 folder:`<svg class="ico" viewBox="0 0 80 64" width="160" height="128"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><path d="M4 10a4 4 0 0 1 4-4h20l7 7h37a4 4 0 0 1 4 4v39a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#d97706"/><path d="M4 20a4 4 0 0 1 4-4h64a4 4 0 0 1 4 4v36a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="url(#fg)"/></svg>`,

 check:(c='#fff',w=3)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,

 clock:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/></svg>`,

 warn:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M12 3.5l9.5 16.5h-19z" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.5h.01"/></svg>`,
};
function browser(url,{x,y,w,h}){const b=H(`<div class="browser" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="bar"><span class="dot" style="background:#f87171"></span><span class="dot" style="background:#fbbf24"></span><span class="dot" style="background:#34d399"></span><div class="url"><span class="ic"></span><span class="u">${url}</span></div></div><div class="page"></div></div>`);b.u=b.querySelector('.u');b.ic=b.querySelector('.ic');b.page=b.querySelector('.page');return b}
function miniSite(){return `<div style="position:absolute;inset:0;background:linear-gradient(135deg,#fdf4ff,#ecfeff)"><div style="display:flex;justify-content:space-between;align-items:center;padding:22px 34px;font:800 22px Inter;color:#0f172a">Your Business<span style="display:flex;gap:22px;font:600 15px Inter;color:#475569"><span>About</span><span>Services</span><span>Contact</span></span></div><div style="display:flex;gap:30px;padding:24px 34px;align-items:center"><div style="flex:1"><div style="font:800 40px/1.1 Inter;color:#0f172a;letter-spacing:-.02em">Quality service,<br>done right.</div><div style="font:500 17px/1.5 Inter;color:#475569;margin:14px 0 22px">Local, friendly and trusted. Book in today.</div><span class="btn teal" style="font-size:17px;padding:12px 22px">Book now</span></div><div style="width:42%;height:200px;border-radius:18px;background:linear-gradient(135deg,#5eead4,#818cf8)"></div></div></div>`}
// ring overlay
function ringOn(rg,e,k,pad=10){if(k<=0.001){rg.style.opacity=0;return}const r=rect(e);rg.style.left=(r.x-pad)+'px';rg.style.top=(r.y-pad)+'px';rg.style.width=(r.w+2*pad)+'px';rg.style.height=(r.h+2*pad)+'px';rg.style.opacity=k;}
// cursor
const cur=document.getElementById('cursor'),rp1=cur.querySelector('.r1'),rp2=cur.querySelector('.r2');
let curKeys=null;
function at(k){if(Array.isArray(k.at))return k.at;const r=rect(k.at);return [r.x+r.w*(k.fx??.5),r.y+r.h*(k.fy??.55)]}

  if(!keys||!keys.length||t<keys[0].t-0.6||t>end){cur.style.opacity=0;return}
  let i=0;while(i<keys.length-1&&keys[i+1].t<=t)i++;

  if(i<keys.length-1){const n=keys[i+1],mv=Math.min(1.0,n.t-keys[i].t),ms=n.t-mv; if(t>ms){const q=at(n);const k=eio(clamp((t-ms)/mv));p=[lerp(p[0],q[0],k),lerp(p[1],q[1],k)]}}
  if(t<keys[0].t){const k=eo(clamp((t-(keys[0].t-.6))/.6));p=[p[0]+(1-k)*120,p[1]+(1-k)*90];cur.style.opacity=k}else cur.style.opacity=Math.min(clamp((end-t)/.3),clamp((keys[keys.length-1].t+1.8-t)/.4));
  cur.style.transform=`translate(${p[0]}px,${p[1]}px)`;

  for(const [rp,r] of [[rp1,r1],[rp2,r2]]){rp.style.opacity=r>0?(1-r):0;rp.style.transform=`scale(${.4+r*1.4})`}

}
// confetti
const fx=document.getElementById('fx').getContext('2d');let bursts=[];
