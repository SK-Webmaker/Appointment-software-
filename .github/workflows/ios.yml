# Building and shipping the iPhone app without owning a Mac.
#
# GitHub's macOS runners come with Xcode already installed, so the whole chain —
# compile, archive, sign, upload to TestFlight — happens here. Nothing in this
# file needs a machine anybody owns.
#
# Two jobs on purpose:
#   build       every push that touches ios/. Compiles for the simulator with
#               signing off, so it needs no Apple account at all and proves the
#               code is real before a single paid minute is spent on signing.
#   testflight  only when a release is published (or the run is dispatched with
#               "ship"), and only if the Apple secrets exist. Skipped silently
#               until the developer account is enrolled, so nothing here has to
#               wait for it.
#
# The repository is public, so GitHub's macOS runners are free here — the whole
# iPhone app is built and shipped without anybody owning a Mac. (On a private
# repository these minutes bill at ten times the Linux rate, which is worth
# remembering if this repository is ever made private.)
name: ios

# `paths` applies to tag pushes too, and a tag changes no files, so a single
# push trigger cannot mean "these paths on branches, and any tag". Shipping
# therefore hangs off a published release rather than a raw tag.
on:
  push:
    branches: ['**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ship:
        description: 'Also archive and upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compile (unsigned)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      # Signing off: this proves the Swift compiles and links. Signing is the
      # testflight job's problem, and it is the only part that needs an account.
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Kairo.xcodeproj \
            -scheme Kairo \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  testflight:
    name: archive and upload
    if: github.event_name == 'release' || inputs.ship
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the Apple secrets are set
        id: secrets
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Whitespace is stripped here, once, and the clean values are what
          # every later step uses.
          #
          # Run 4 failed on this. A copied Issuer ID carried trailing spaces,
          # which made the JWT's issuer claim wrong, so Apple answered 401 on
          # listTeams and Xcode then reported "No profiles for
          # com.kairobookings.kairo were found" — an error about provisioning
          # that was really an error about a space. Nobody would find that by
          # reading it, because GitHub masks the value and the spaces sit
          # outside the mask.
          #
          # All three are alphanumeric-and-hyphen tokens with no legitimate
          # whitespace anywhere in them, so deleting it cannot corrupt a good
          # value. The .p8 is deliberately NOT treated this way: its newlines
          # are load-bearing.
          KEY_ID="$(printf '%s' "$KEY_ID" | tr -d '[:space:]')"
          ISSUER="$(printf '%s' "$ISSUER" | tr -d '[:space:]')"
          TEAM="$(printf '%s' "$TEAM" | tr -d '[:space:]')"
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$TEAM" ]; then
            echo "Apple credentials are not set yet — nothing to upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "ASC_KEY_ID=$KEY_ID"
              echo "ASC_ISSUER_ID=$ISSUER"
              echo "APPLE_TEAM_ID=$TEAM"
            } >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen

      # The App Store Connect API key is how CI signs without anybody exporting
      # a certificate from a Mac: Xcode fetches and renews the profiles itself.
      - name: Put the App Store Connect key where Xcode looks for it
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Generate the project
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: |
          xcodegen generate
          # The build number is the run number, which only ever goes up. Apple
          # refuses a build it has seen before, and a hand-kept counter is the
          # thing everybody forgets.
          echo "build = ${GITHUB_RUN_NUMBER}"

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          # MARKETING_VERSION is CFBundleShortVersionString, and App Store
          # Connect will only accept one to three dot-separated numbers.
          #
          # This used to be the ref name with an "ios-v" prefix stripped, which
          # is right for a release tag and wrong for everything else: dispatched
          # from a branch it produced MARKETING_VERSION=claude/markdown-file-
          # analysis-a5ppnf. Non-empty, so the old guard passed it straight
          # through to an upload Apple would have rejected.
          #
          # So the shape is checked rather than the emptiness. Anything that is
          # not a version number is not one, and 1.0.0 is used instead.
          #
          # The archive is UNSIGNED, and the export below is what signs it.
          #
          # Signing here cannot be made to work, and the two ways it fails are
          # worth recording because each looks like a different problem:
          #
          #   Automatic signing resolves to an iOS App DEVELOPMENT profile, and
          #   a development profile enumerates the devices allowed to run the
          #   build — so a team with no registered devices cannot have one:
          #     "Your team has no devices from which to generate a
          #      provisioning profile"   (run 6)
          #
          #   Pinning CODE_SIGN_IDENTITY="Apple Distribution" to force the other
          #   kind is refused outright, because an automatic signing style may
          #   not also name an identity:
          #     "Kairo has conflicting provisioning settings ... automatically
          #      signed for development, but a conflicting code signing
          #      identity Apple Distribution has been manually specified"
          #                              (run 8)
          #
          # Archiving unsigned sidesteps the resolution entirely. The export
          # step then signs for app-store-connect, and a DISTRIBUTION profile
          # enumerates no devices at all — so nothing has to be registered, and
          # there is still no Mac and no iPhone anywhere in this.
          VERSION="${GITHUB_REF_NAME#ios-v}"; VERSION="${VERSION#v}"
          case "$VERSION" in
            *[!0-9.]*|''|.*|*.) VERSION="1.0.0" ;;
          esac
          echo "Marketing version: $VERSION (build $GITHUB_RUN_NUMBER)"
          xcodebuild \
            -project Kairo.xcodeproj \
            -scheme Kairo \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Kairo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Kairo.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # "Error Downloading App Information" and its siblings are what
      # -exportArchive prints; the reason it actually got from Apple is written
      # into an .xcdistributionlogs bundle in a temp directory and then thrown
      # away with the runner. Two rounds were spent inferring a cause that was
      # sitting in that file, so it is printed whenever the export fails.
      - name: Why the export failed
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for d in "${TMPDIR:-/tmp}"/*.xcdistributionlogs "$HOME"/Library/Logs/gym/*.xcdistributionlogs; do
            found=1
            echo "──────── $d ────────"
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              echo "── $(basename "$f")"
              # IDEDistribution.standard.log carries the server's own words.
              tail -c 20000 "$f"
              echo
            done
          done
          [ "$found" = 1 ] || echo "(no .xcdistributionlogs bundle was produced)"

      - name: Forget the key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
