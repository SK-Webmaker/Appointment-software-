name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      # No install step: Kairo has no dependencies, and the tests use node:test.
      - run: npm test
      - run: npm run test:falsify
