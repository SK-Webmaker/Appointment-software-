# Render Blueprint — one Kairo instance for one business.
#
# Why this file exists: setting a service up by hand means eight form fields,
# and the one that is easiest to forget (the persistent disk) is the one that
# silently destroys the salon's data on the next deploy. Here it is declared,
# so every business gets it.
#
# THIS IS A TEMPLATE. Two values below have to change for every business, and
# Render blueprints have no variables, so they change by editing. `name` in
# particular: Render will not create a second service with a name that is
# already taken, so copying this unchanged fails on the second business.
#
#   node scripts/onboard-business.mjs --business glowbar --render
#
# prints this file already filled in for one business, ready to paste.
#
# To add a business, entirely in the browser:
#   Render → New → Blueprint → pick this repo → Apply, then add the custom
#   domain <business>.kairobookings.com on the service's Settings page.
#
# Everything else — Node version, the disk, HTTPS, auto-deploy — comes from here.
services:
  - type: web
    # ---- CHANGE ME: one per business, and it must be unique in the account.
    # The convention is "<business>-booking", matching the subdomain the
    # onboarding script creates: hairbysha-booking ↔ hairbysha.kairobookings.com
    name: CHANGEME-booking
    runtime: node
    plan: starter          # a disk cannot be attached to the free plan

    # ---- CHANGE ME: the region nearest the business's customers.
    # Render has no Australian region; Singapore is the closest by a wide
    # margin (roughly half the round trip of Oregon to Melbourne), and every
    # page load pays that latency.
    #   Australia / NZ / SE Asia → singapore
    #   UK / Europe              → frankfurt
    #   US west / default        → oregon
    #   US east                  → virginia | ohio
    region: singapore
    branch: main
    buildCommand: ""       # nothing to build: no dependencies, no bundler
    startCommand: npm start
    healthCheckPath: /api/version
    autoDeploy: true

    # The whole business lives in one SQLite file on this disk. Without it,
    # Render hands the service a clean filesystem on every deploy and the file
    # goes with it. Kairo refuses to start quietly in that state — it prints a
    # DATA WILL BE LOST banner — but the point is to never get there.
    disk:
      name: kairo-data
      mountPath: /var/data
      sizeGB: 1            # a busy salon's database is single-digit megabytes

    envVars:
      - key: KAIRO_DATA_DIR
        value: /var/data   # must match mountPath above

      # node:sqlite needs a recent Node. Render's default is older than this.
      - key: NODE_VERSION
        value: "22.22.2"

      # Render terminates TLS in front of the app, so the session cookie can be
      # marked Secure and the rate limiter can trust x-forwarded-for.
      - key: KAIRO_SECURE_COOKIES
        value: "1"

      # ---- CHANGE ME: this business's address on the platform domain.
      # Every cancel link, review link, ICS file and QR code is built from it.
      # Set here rather than in Settings because the subdomain is known when the
      # service is created, and forgetting it doesn't break anything visibly —
      # it just quietly puts the wrong domain in every message the salon sends.
      # Add the matching custom domain on the service's Settings page.
      - key: KAIRO_PUBLIC_URL
        value: https://CHANGEME.kairobookings.com

      # ---- fill these two in when you create the service -------------------
      # They are only read on the very first boot, when the owner's account is
      # created. Setting them later does nothing.
      - key: KAIRO_ADMIN_EMAIL
        sync: false        # Render will prompt for it
      - key: KAIRO_ADMIN_PASSWORD
        sync: false        # use a generated one; the owner changes it with you
