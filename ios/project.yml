# XcodeGen spec. The .xcodeproj is generated, never committed: an Xcode project
# file is a merge-conflict machine and nobody here has Xcode to resolve one in.
#
#   brew install xcodegen && xcodegen generate     (on a Mac)
#   .github/workflows/ios.yml does exactly that on a hosted macOS runner
name: Kairo
options:
  bundleIdPrefix: com.kairobookings
  # iOS 17 is two major versions old at launch and covers the overwhelming
  # majority of iPhones in use. It also means the modern SwiftUI and
  # concurrency APIs below need no back-compatible second version.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""              # filled from a secret in CI; empty builds unsigned
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Kairo:
    type: application
    platform: iOS
    sources:
      - path: Kairo
    info:
      path: Kairo/Info.plist
      properties:
        CFBundleDisplayName: Kairo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Every one of these is asked for by something the owner actually does.
        NSCameraUsageDescription: Take a photo of a client's hair for their record.
        NSPhotoLibraryUsageDescription: Attach a photo from your library to a client's record.
        NSFaceIDUsageDescription: Unlock Kairo without typing your password.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kairobookings.kairo
        # iPhone only ("1"). It was "1,2" — iPhone and iPad — and App Store
        # Connect rejected the upload for it:
        #
        #   ContentDelivery 90474: ... you need to include all of the
        #   Portrait, PortraitUpsideDown, LandscapeLeft, LandscapeRight
        #   orientations to support iPad multitasking
        #
        # An iPad app must accept all four orientations, and this one lists
        # three because upside-down is wrong for a phone propped on a counter.
        # The orientation clash is only the visible half though. Declaring iPad
        # support also obliges the App Store listing to carry iPad screenshots,
        # and it ships a layout drawn for a phone — fixed scale, no zoom, a
        # phone-width nav — onto a 13-inch screen, which is what guideline
        # 4.0 and 2.3.1 rejections are made of.
        #
        # iPhone apps still install and run on iPad, so nothing is taken away
        # from an owner who has one. When iPad is done properly this becomes
        # "1,2" again with a UISupportedInterfaceOrientations~ipad key holding
        # all four, which keeps the phone from ever going upside down.
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Kairo/Kairo.entitlements
      properties:
        # production, not development.
        #
        # This decides which Apple push network the app's device token belongs
        # to, and the two are separate: a token minted under 'development'
        # exists only in the sandbox and api.push.apple.com — which is what the
        # shard sends to — has never heard of it. TestFlight and App Store
        # builds are production builds, so a 'development' entitlement here
        # means every push silently goes nowhere, with a valid-looking token
        # and no error anywhere.
        #
        # Nothing is lost by this: debug builds off a Mac are the only thing
        # that wants the sandbox, and there is no Mac in this project.
        aps-environment: production
        com.apple.developer.associated-domains:
          - applinks:kairobookings.com
          - applinks:*.kairobookings.com
          - webcredentials:kairobookings.com
